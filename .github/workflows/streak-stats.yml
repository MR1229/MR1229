name: Update Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  update-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats-action@v1
        with:
          user_id: MR1229
          theme: dark
          hide_border: true
          background: 0D1117
          border: 30363D
          stroke: 30363D
          ring: 58A6FF
          fire: FFA657
          currStreakNum: FFFFFF
          sideNums: FFFFFF
          currStreakLabel: 58A6FF
          sideLabels: 8B949E
          dates: 8B949E
          output: assets/streak-stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: MR1229
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile assets"
          file_pattern: assets/*.svg
