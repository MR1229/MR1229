<svg width="620" height="76" viewBox="0 0 620 76" xmlns="http://www.w3.org/2000/svg">
  <style>
    .greet { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #9CA3AF; }
    .name { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 38px; fill: #F4F4F5; }
    .accent { fill: #2EC4B6; }
    .rule { stroke: #2EC4B6; stroke-width: 2; }
  </style>
  <text x="310" y="30" text-anchor="middle" class="greet">Hi, I'm</text>
  <text x="310" y="62" text-anchor="middle" class="name">Mahesh <tspan class="accent">Pawar</tspan></text>
  <line x1="270" y1="70" x2="350" y2="70" class="rule"/>
</svg>
