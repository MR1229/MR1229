<svg width="620" height="92" viewBox="0 0 620 92" xmlns="http://www.w3.org/2000/svg">
  <style>
    .greet {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 300;
      font-size: 18px;
      fill: #B8C4D0;
      letter-spacing: 8px;
    }
    .name {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 700;
      font-size: 44px;
      fill: #F5F8FA;
      letter-spacing: 4px;
    }
    .accent { fill: #C9A66B; }
    .rule { stroke: #C9A66B; stroke-width: 1.5; }
  </style>

  <text x="310" y="28" text-anchor="middle" class="greet">HELLO, I&#8217;M</text>
  <line x1="270" y1="44" x2="350" y2="44" class="rule"/>
  <text x="310" y="82" text-anchor="middle" class="name">MAHESH <tspan class="accent">PAWAR</tspan></text>
</svg>
